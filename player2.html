<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .player-container {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <iframe id="marcoPlayer" src="" allowfullscreen></iframe>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const batchId = params.get('batchId');
        const subjectId = params.get('subjectId');
        const lectureId = params.get('lectureId');

        if (batchId && subjectId && lectureId) {
            const baseUrl = "https://marco-player.pages.dev/player/api";
            const dynamicUrl = `${baseUrl}/${batchId}/${subjectId}/${lectureId}/marco-player`;
            document.getElementById('marcoPlayer').src = dynamicUrl;
        } else {
            document.body.innerHTML = '<div style="color:white; text-align:center; padding-top:20vh; font-family:sans-serif;"><h2>Error: Missing Player IDs!</h2></div>';
        }
    </script>
</body>
</html>
